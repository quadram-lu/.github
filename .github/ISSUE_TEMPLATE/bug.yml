name: Bug
description: Signaler un dysfonctionnement
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Ne mettez aucune donnée personnelle de client (nom, adresse, e-mail…). Utilisez une référence interne.
  - type: input
    id: version
    attributes:
      label: Version concernée
      placeholder: ex. 3.2.0
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Référence interne du ticket support
      placeholder: ex. SUP-2026-0142
  - type: textarea
    id: description
    attributes:
      label: Description du problème
      description: Ce qui se passe, et ce qui devrait se passer.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Constater…
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Bloquant (le client ne peut plus travailler)
        - Majeur (contournement possible)
        - Mineur (gêne)
    validations:
      required: true
  - type: textarea
    id: environnement
    attributes:
      label: Environnement
      placeholder: Windows 11, SQL Server 2022, poste ou serveur…
